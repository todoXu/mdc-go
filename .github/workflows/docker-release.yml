name: docker-release

# 修改 internal/server/version.go 中的版本号并推送到 main 分支时，构建多架构镜像并推送到 Docker Hub。
on:
  push:
    branches: [main]
    paths:
      - "internal/server/version.go"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/server/version.go)
          if [ -z "$VERSION" ]; then
            echo "无法从 internal/server/version.go 读取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "镜像版本：$VERSION"

      - name: 设置 QEMU（用于构建 arm64）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            todoxu/mdc-go:${{ steps.version.outputs.version }}
            todoxu/mdc-go:latest
