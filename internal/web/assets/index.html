<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>MDC Go · 媒体工作台</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/provider.css" />
    <link rel="stylesheet" href="/priority.css" />
    <link rel="stylesheet" href="/gallery.css" />
    <link rel="stylesheet" href="/record-actions.css" />
    <link rel="stylesheet" href="/overview.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/"
        ><span class="brand-mark">m<span>·</span></span
        ><span>MDC <b>Go</b><small>你的媒体整理工作台</small></span></a
      >
      <div class="nav-label">工作空间</div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <span class="local-dot"></span>
        <div>Windows 本地版<small>数据保存在这台电脑上</small></div>
        <span class="version">α</span>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menu" aria-label="切换导航">☰</button>
        <div id="breadcrumb">工作空间 <span>/</span> 概览</div>
        <div class="top-actions">
          <span class="connection" id="connection"><i></i>正在连接</span
          ><button class="icon-button" id="refresh" aria-label="刷新数据" title="刷新数据">↻</button
          ><a class="avatar" id="profile-avatar" href="#/settings/user" aria-label="用户设置">M</a>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        MDC Go <span>·</span> 让媒体库井然有序
        <span class="footer-right">本地运行 / 前端重建版</span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2>有尚未保存的修改</h2>
        <p>离开此页面会丢弃本次修改。</p>
        <div class="dialog-actions">
          <button value="cancel" class="button">继续编辑</button
          ><button value="leave" class="button primary">放弃修改并离开</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
